---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/component: mongod
    app.kubernetes.io/instance: some-name
    app.kubernetes.io/managed-by: percona-server-mongodb-operator
    app.kubernetes.io/name: percona-server-mongodb
    app.kubernetes.io/part-of: percona-server-mongodb
    app.kubernetes.io/replset: rs0
  name: some-name-rs0
  namespace: upgrade
  ownerReferences:
  - apiVersion: psmdb.percona.com/v1
    controller: true
    kind: PerconaServerMongoDB
    name: some-name
    uid: ""
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: mongod
      app.kubernetes.io/instance: some-name
      app.kubernetes.io/managed-by: percona-server-mongodb-operator
      app.kubernetes.io/name: percona-server-mongodb
      app.kubernetes.io/part-of: percona-server-mongodb
      app.kubernetes.io/replset: rs0
  serviceName: some-name-rs0
  template:
    metadata:
      annotations:
        percona.com/configuration-hash: ad7cbf2eb1032ae7e0237dc53930d09e
      labels:
        app.kubernetes.io/component: mongod
        app.kubernetes.io/instance: some-name
        app.kubernetes.io/managed-by: percona-server-mongodb-operator
        app.kubernetes.io/name: percona-server-mongodb
        app.kubernetes.io/part-of: percona-server-mongodb
        app.kubernetes.io/replset: rs0
    spec:
      containers:
      - args:
        - --bind_ip_all
        - --auth
        - --dbpath=/data/db
        - --port=27017
        - --replSet=rs0
        - --storageEngine=wiredTiger
        - --relaxPermChecks
        - --sslAllowInvalidCertificates
        - --clusterAuthMode=x509
        - --tlsMode=preferTLS
        - --enableEncryption
        - --encryptionKeyFile=/etc/mongodb-encryption/encryption-key
        - --wiredTigerCacheSizeGB=0.25
        - --wiredTigerIndexPrefixCompression=true
        - --config=/etc/mongodb-config/mongod.conf
        - --quiet
        command:
        - /opt/percona/ps-entry.sh
        env:
        - name: SERVICE_NAME
          value: some-name
        - name: NAMESPACE
          value: upgrade
        - name: MONGODB_PORT
          value: "27017"
        - name: MONGODB_REPLSET
          value: rs0
        envFrom:
        - secretRef:
            name: internal-some-name-users
            optional: false
        image: percona/percona-server-mongodb:sometag
        imagePullPolicy: Always
        livenessProbe:
          exec:
            command:
            - /opt/percona/mongodb-healthcheck
            - k8s
            - liveness
            - --ssl
            - --sslInsecure
            - --sslCAFile
            - /etc/mongodb-ssl/ca.crt
            - --sslPEMKeyFile
            - /tmp/tls.pem
            - --startupDelaySeconds
            - "7200"
          failureThreshold: 4
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        name: mongod
        ports:
        - containerPort: 27017
          name: mongodb
        readinessProbe:
          exec:
            command:
            - /opt/percona/mongodb-healthcheck
            - k8s
            - readiness
            - --component
            - mongod
            - --ssl
            - --sslInsecure
            - --sslCAFile
            - /etc/mongodb-ssl/ca.crt
            - --sslPEMKeyFile
            - /tmp/tls.pem
          failureThreshold: 8
          initialDelaySeconds: 10
          periodSeconds: 3
          successThreshold: 1
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 500m
            memory: 500M
          requests:
            cpu: 100m
            memory: 100M
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
        volumeMounts:
        - mountPath: /data/db
          name: mongod-data
        - mountPath: /etc/mongodb-secrets
          name: some-name-mongodb-keyfile
          readOnly: true
        - mountPath: /etc/mongodb-ssl
          name: ssl
          readOnly: true
        - mountPath: /etc/mongodb-ssl-internal
          name: ssl-internal
          readOnly: true
        - mountPath: /etc/mongodb-config
          name: config
        - mountPath: /opt/percona
          name: bin
        - mountPath: /.mongodb
          name: mongosh
        - mountPath: /etc/mongodb-encryption
          name: some-name-mongodb-encryption-key
          readOnly: true
        - mountPath: /etc/users-secret
          name: users-secret-file
        workingDir: /data/db
      initContainers:
      - command:
        - /init-entrypoint.sh
        image: percona/percona-server-mongodb-operator:sometag
        imagePullPolicy: Always
        name: mongo-init
        resources:
          limits:
            cpu: 500m
            memory: 500M
          requests:
            cpu: 100m
            memory: 100M
        volumeMounts:
        - mountPath: /opt/percona
          name: bin
      restartPolicy: Always
      securityContext:
        fsGroup: 1001
      serviceAccountName: default
      terminationGracePeriodSeconds: 60
      volumes:
      - name: some-name-mongodb-keyfile
        secret:
          defaultMode: 288
          optional: false
          secretName: some-name-mongodb-keyfile
      - emptyDir: {}
        name: bin
      - emptyDir: {}
        name: mongosh
      - configMap:
          name: some-name-rs0-mongod
          optional: true
        name: config
      - name: some-name-mongodb-encryption-key
        secret:
          defaultMode: 288
          optional: false
          secretName: some-name-mongodb-encryption-key
      - name: ssl
        secret:
          defaultMode: 288
          optional: false
          secretName: some-name-ssl
      - name: ssl-internal
        secret:
          defaultMode: 288
          optional: true
          secretName: some-name-ssl-internal
      - name: users-secret-file
        secret:
          secretName: internal-some-name-users
  updateStrategy:
    type: OnDelete
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: mongod-data
      namespace: upgrade
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
    status: {}
status:
  availableReplicas: 0
  replicas: 0
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: some-name
    app.kubernetes.io/managed-by: percona-server-mongodb-operator
    app.kubernetes.io/name: percona-server-mongodb
    app.kubernetes.io/part-of: percona-server-mongodb
    app.kubernetes.io/replset: rs0
  name: some-name-rs0
  namespace: upgrade
  ownerReferences:
  - apiVersion: psmdb.percona.com/v1
    controller: true
    kind: PerconaServerMongoDB
    name: some-name
    uid: ""
spec:
  clusterIP: None
  ports:
  - appProtocol: mongo
    name: mongodb
    port: 27017
    targetPort: 27017
  selector:
    app.kubernetes.io/instance: some-name
    app.kubernetes.io/managed-by: percona-server-mongodb-operator
    app.kubernetes.io/name: percona-server-mongodb
    app.kubernetes.io/part-of: percona-server-mongodb
    app.kubernetes.io/replset: rs0
status:
  loadBalancer: {}
