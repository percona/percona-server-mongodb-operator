    app.kubernetes.io/part-of: percona-server-mongodb
    app.kubernetes.io/replset: cfg
  name: some-name-cfg
  namespace: upgrade
  ownerReferences:
  - apiVersion: psmdb.percona.com/v1
    controller: true
    kind: PerconaServerMongoDB
    name: some-name
    uid: ""
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: cfg
      app.kubernetes.io/instance: some-name
      app.kubernetes.io/managed-by: percona-server-mongodb-operator
      app.kubernetes.io/name: percona-server-mongodb
      app.kubernetes.io/part-of: percona-server-mongodb
      app.kubernetes.io/replset: cfg
  serviceName: some-name-cfg
  template:
    metadata:
      labels:
        app.kubernetes.io/component: cfg
        app.kubernetes.io/instance: some-name
        app.kubernetes.io/managed-by: percona-server-mongodb-operator
        app.kubernetes.io/name: percona-server-mongodb
        app.kubernetes.io/part-of: percona-server-mongodb
        app.kubernetes.io/replset: cfg
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/component: cfg
                app.kubernetes.io/instance: some-name
                app.kubernetes.io/managed-by: percona-server-mongodb-operator
                app.kubernetes.io/name: percona-server-mongodb
                app.kubernetes.io/part-of: percona-server-mongodb
                app.kubernetes.io/replset: cfg
            topologyKey: kubernetes.io/hostname
      containers:
      - args:
        - --bind_ip_all
        - --auth
        - --dbpath=/data/db
        - --port=27017
        - --replSet=cfg
        - --storageEngine=wiredTiger
        - --relaxPermChecks
        - --sslAllowInvalidCertificates
        - --clusterAuthMode=x509
        - --tlsMode=preferTLS
        - --configsvr
        - --enableEncryption
        - --encryptionKeyFile=/etc/mongodb-encryption/encryption-key
        - --wiredTigerCacheSizeGB=0.25
        - --wiredTigerIndexPrefixCompression=true
        - --quiet
        command:
        - /opt/percona/ps-entry.sh
        env:
        - name: SERVICE_NAME
          value: some-name
        - name: NAMESPACE
          value: upgrade
        - name: MONGODB_PORT
          value: "27017"
        - name: MONGODB_REPLSET
          value: cfg
        envFrom:
        - secretRef:
            name: internal-some-name-users
            optional: false
        image: percona/percona-server-mongodb:sometag
        imagePullPolicy: Always
        livenessProbe:
          exec:
            command:
            - /opt/percona/mongodb-healthcheck
            - k8s
            - liveness
            - --ssl
            - --sslInsecure
            - --sslCAFile
            - /etc/mongodb-ssl/ca.crt
            - --sslPEMKeyFile
            - /tmp/tls.pem
            - --startupDelaySeconds
            - "7200"
          failureThreshold: 4
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        name: mongod
        ports:
        - containerPort: 27017
          name: mongodb
        readinessProbe:
          exec:
            command:
            - /opt/percona/mongodb-healthcheck
            - k8s
            - readiness
            - --component
            - mongod
            - --ssl
            - --sslInsecure
            - --sslCAFile
            - /etc/mongodb-ssl/ca.crt
            - --sslPEMKeyFile
            - /tmp/tls.pem
          failureThreshold: 3
          initialDelaySeconds: 10
          periodSeconds: 3
          successThreshold: 1
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 300m
            memory: 500M
          requests:
            cpu: 300m
            memory: 500M
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
        volumeMounts:
        - mountPath: /data/db
          name: mongod-data
        - mountPath: /etc/mongodb-secrets
          name: some-name-mongodb-keyfile
          readOnly: true
        - mountPath: /etc/mongodb-ssl
          name: ssl
          readOnly: true
        - mountPath: /etc/mongodb-ssl-internal
          name: ssl-internal
          readOnly: true
        - mountPath: /opt/percona
          name: bin
        - mountPath: /.mongodb
          name: mongosh
        - mountPath: /etc/mongodb-encryption
          name: some-name-mongodb-encryption-key
          readOnly: true
        - mountPath: /etc/users-secret
          name: users-secret-file
        workingDir: /data/db
      initContainers:
      - command:
        - /init-entrypoint.sh
        image: percona/percona-server-mongodb-operator:sometag
        imagePullPolicy: Always
        name: mongo-init
        resources:
          limits:
            cpu: 300m
            memory: 500M
          requests:
            cpu: 300m
            memory: 500M
        volumeMounts:
        - mountPath: /data/db
          name: mongod-data
        - mountPath: /opt/percona
          name: bin
      restartPolicy: Always
      securityContext:
        fsGroup: 1001
      serviceAccountName: default
      terminationGracePeriodSeconds: 60
      volumes:
      - name: some-name-mongodb-keyfile
        secret:
          defaultMode: 288
          optional: false
          secretName: some-name-mongodb-keyfile
      - emptyDir: {}
        name: bin
      - emptyDir: {}
        name: mongosh
      - name: some-name-mongodb-encryption-key
        secret:
          defaultMode: 288
          optional: false
          secretName: some-name-mongodb-encryption-key
      - name: ssl
        secret:
          defaultMode: 288
          optional: false
          secretName: some-name-ssl
      - name: ssl-internal
        secret:
          defaultMode: 288
          optional: true
          secretName: some-name-ssl-internal
      - name: users-secret-file
        secret:
          secretName: internal-some-name-users
  updateStrategy:
    type: OnDelete
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: mongod-data
      namespace: upgrade
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 3Gi
    status: {}
status:
  availableReplicas: 0
  replicas: 0
