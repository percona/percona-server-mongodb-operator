name: e2e-tests Python Quality Check

on:
  pull_request:
    paths:
      - 'e2e-tests/**/*.py'
      - 'installers/olm/e2e-tests/**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run ruff check
        run: uv run ruff check e2e-tests/ installers/olm/e2e-tests/

      - name: Run mypy
        run: |
          uv run mypy e2e-tests/
          MYPYPATH=e2e-tests uv run mypy installers/olm/e2e-tests/

      # Same command as `make py-unit` (see the Makefile for the flags).
      - name: Run unit tests
        run: |
          PYTHONPATH=e2e-tests:installers/olm/e2e-tests uv run pytest --noconftest -p no:cacheprovider -q e2e-tests/lib/ installers/olm/e2e-tests/test_olm.py

      # Resolves every fixture without a cluster, so a renamed or removed fixture in
      # conftest.py fails here. Same commands as `make py-setup-plan` (see the Makefile
      # for the flags).
      - name: Check test fixtures
        run: |
          uv run pytest --setup-plan -q -p no:cacheprovider -p no:dependency e2e-tests/
          PYTHONPATH=e2e-tests:installers/olm/e2e-tests uv run pytest --setup-plan -q -p no:cacheprovider -p no:dependency -p conftest installers/olm/e2e-tests/