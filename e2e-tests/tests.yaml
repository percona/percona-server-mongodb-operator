# suites: pr, release, minikube, distro, backups
# groups: backup, chaos, core, monitoring, networking, pitr, security, sharding, storage, tls, upgrade, users
#
# Placement, for CI runs with several tests on one cluster. A test without these fields shares
# the cluster with any other test, so it must touch only its own namespaces. Create namespaces
# with the create_namespace / create_infra helpers: the CI runner deletes them after the test by
# the label these helpers set.
#   ownCluster: true   the test changes something every test on the cluster uses (CRDs, a
#                      released operator, chaos-mesh, the default StorageClass, cert-manager:
#                      with it installed the operator issues all certificates through it).
#                      It runs alone.
#   locks: [name]      the test changes a cluster-wide resource that other tests with the same
#                      lock also change (vault, cluster-rbac, nodes, storageclass,
#                      priorityclass).
#                      Tests with the same lock run one at a time per cluster, next to the rest.
# `uv run e2e-tests/select_tests.py check-placement` finds tests that need a tag and prints it.
