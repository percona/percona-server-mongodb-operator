platformSkips:
  gke:
    - name: demand-backup-eks-credentials
      reason: requires EKS credentials integration
    - name: demand-backup-eks-credentials-irsa
      reason: requires EKS IRSA
  gke-arm64:
    - name: monitoring-2-0
      reason: PMM 2 images are unavailable for ARM64
    - name: monitoring-pmm3
      reason: PMM 3 images are unavailable for ARM64
    - name: upgrade
      reason: upgrade images are unavailable for ARM64
    - name: upgrade-sharded
      reason: upgrade images are unavailable for ARM64
    - name: upgrade-partial-backup
      reason: upgrade images are unavailable for ARM64
  eks:
    - name: demand-backup-gcs-workload-identity
      reason: requires GKE Workload Identity
    - name: demand-backup-snapshot
      reason: volume snapshot setup currently supports only GKE
    - name: demand-backup-snapshot-vault
      reason: volume snapshot setup currently supports only GKE
    - name: multi-cluster-service
      reason: requires GKE Multi-Cluster Services
  aks:
    - name: demand-backup-eks-credentials
      reason: requires EKS credentials integration
    - name: demand-backup-eks-credentials-irsa
      reason: requires EKS IRSA
    - name: demand-backup-gcs-workload-identity
      reason: requires GKE Workload Identity
    - name: demand-backup-snapshot
      reason: volume snapshot setup currently supports only GKE
    - name: demand-backup-snapshot-vault
      reason: volume snapshot setup currently supports only GKE
    - name: multi-cluster-service
      reason: requires GKE Multi-Cluster Services
  openshift:
    - name: demand-backup-eks-credentials
      reason: requires EKS credentials integration
    - name: demand-backup-eks-credentials-irsa
      reason: requires EKS IRSA
    - name: demand-backup-gcs-workload-identity
      reason: requires GKE Workload Identity
    - name: demand-backup-snapshot
      reason: volume snapshot setup currently supports only GKE
    - name: demand-backup-snapshot-vault
      reason: volume snapshot setup currently supports only GKE
    - name: multi-cluster-service
      reason: requires GKE Multi-Cluster Services
    - name: storage
      reason: requires hostPath, which is unsupported on OpenShift

