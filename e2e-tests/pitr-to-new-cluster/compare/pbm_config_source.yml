storage:
  type: s3
  s3:
    region: us-east-1
    endpointUrl: http://s3-storage-all-in-one:8333/
    forcePathStyle: true
    bucket: operator-testing
    prefix: some-name-source
    credentials:
      access-key-id: '***'
      secret-access-key: '***'
    maxUploadParts: 10000
    storageClass: STANDARD
    insecureSkipTLSVerify: false
pitr:
  enabled: false
  compression: s2
backup:
  oplogSpanMin: 0
  compression: s2
restore: {}
lifecycle:
  enabled: false
  purgeFailed: false
  dailyRetention: 0
  weeklyRetention: 0
  weeklyDay: 0
  monthlyRetention: 0
  monthlyDay: 0
