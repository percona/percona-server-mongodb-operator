apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: some-name
  finalizers:
    - percona.com/delete-psmdb-pods-in-order
    - percona.com/delete-psmdb-pvc
spec:
  image:
  imagePullPolicy: Always
  storageScaling:
    enableVolumeScaling: true
  backup:
    enabled: false
  replsets:
    - name: rs0
      size: 3
      affinity:
        antiAffinityTopologyKey: none
      resources:
        limits:
          cpu: 500m
          memory: 1G
        requests:
          cpu: 100m
          memory: 0.1G
      volumeSpec:
        persistentVolumeClaim:
          resources:
            requests:
              storage: 3Gi
  secrets:
    users: some-users
  logcollector:
    enabled: true
    image: perconalab/fluentbit:main-logcollector
    resources:
      requests:
        memory: 100M
        cpu: 200m
