apiVersion: v1
kind: Secret
metadata:
  name: openldap
type: Opaque
stringData:
  adminpassword: adminpassword
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openldap-data
data:
  50-perconadba.ldif: |
    dn: ou=perconadba,dc=ldap,dc=local
    objectClass: organizationalUnit
    ou: perconadba

    dn: uid=percona,ou=perconadba,dc=ldap,dc=local
    objectClass: inetOrgPerson
    uid: percona
    cn: percona
    sn: percona
    userPassword: password

    dn: cn=admin,ou=perconadba,dc=ldap,dc=local
    objectClass: groupOfUniqueNames
    cn: admin
    uniqueMember: uid=percona,ou=perconadba,dc=ldap,dc=local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openldap
  labels:
    app.kubernetes.io/name: openldap
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: openldap
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openldap
    spec:
      serviceAccountName: openldap
      containers:
        - name: openldap
          image: docker.io/osixia/openldap:2.6.15
          env:
            - name: OPENLDAP_BOOTSTRAP_ORGANIZATION
              value: "ldap.local"
            - name: OPENLDAP_BOOTSTRAP_SUFFIX
              value: "dc=ldap,dc=local"
            - name: OPENLDAP_BOOTSTRAP_DATA_ROOT_PASSWORD_HASHED
              valueFrom:
                secretKeyRef:
                  key: adminpassword
                  name: openldap
            - name: OPENLDAP_BOOTSTRAP_CONFIG_ROOT_PASSWORD_HASHED
              valueFrom:
                secretKeyRef:
                  key: adminpassword
                  name: openldap
            - name: OPENLDAP_BOOTSTRAP_DATA_READONLY
              value: "true"
            - name: OPENLDAP_BOOTSTRAP_DATA_READONLY_PASSWORD_HASHED
              value: "readonlypass"
          ports:
            - name: tcp-ldap
              containerPort: 3890
          readinessProbe:
            tcpSocket:
              port: 3890
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          volumeMounts:
            - name: openldap-data
              mountPath: /container/services/openldap-bootstrap/assets/ldif/data/custom
      volumes:
        - name: openldap-data
          configMap:
            name: openldap-data
---
apiVersion: v1
kind: Service
metadata:
  name: openldap
  labels:
    app.kubernetes.io/name: openldap
spec:
  type: ClusterIP
  ports:
    - name: tcp-ldap
      port: 389
      targetPort: tcp-ldap
  selector:
    app.kubernetes.io/name: openldap
