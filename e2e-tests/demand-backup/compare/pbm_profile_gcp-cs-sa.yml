name: gcp-cs-sa
profile: true
storage:
  type: gcs
  gcs:
    bucket: operator-testing
    prefix: psmdb-demand-backup
    credentials:
      clientEmail: '***'
      privateKey: '***'
    chunkSize: 10485760
    retryer:
      backoffInitial: 1ns
      backoffMax: 30ns
      backoffMultiplier: 2
      maxAttempts: 5
      chunkRetryDeadline: 32s
lifecycle:
  enabled: false
  purgeFailed: false
  dailyRetention: 0
  weeklyRetention: 0
  weeklyDay: 0
  monthlyRetention: 0
  monthlyDay: 0
