apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: some-name
spec:
  #platform: openshift
  image:
  imagePullPolicy: Always
  backup:
    enabled: true
    image: perconalab/percona-server-mongodb-operator:1.1.0-backup
    resources:
      requests:
        cpu: "300m"
        memory: "0.5G"
    storages:
      aws-s3:
        main: true
        type: s3
        s3:
          credentialsSecret: aws-s3-secret
          region: us-east-1
          bucket: operator-testing
          prefix: psmdb-scheduled-backup
          insecureSkipTLSVerify: false
      local-s3:
        type: s3
        s3:
          credentialsSecret: s3-secret
          region: us-east-1
          bucket: operator-testing
          endpointUrl: http://s3-storage-all-in-one:8333/
          insecureSkipTLSVerify: false
      gcp-cs:
        type: gcs
        gcs:
          credentialsSecret: gcp-cs-sa-key-secret
          bucket: operator-testing
          prefix: psmdb-scheduled-backup
      azure-blob:
        type: azure
        azure:
          container: operator-testing
          prefix: psmdb-scheduled-backup
          credentialsSecret: azure-secret
    tasks:
    - name: every-min-local-s3
      enabled: true
      retention:
        type: count
        count: 1
        deleteFromStorage: true
      type: physical
      schedule: "* * * * *"
      compressionType: gzip
      storageName: local-s3
    - name: weekly
      enabled: true
      retention:
        type: count
        count: 1
        deleteFromStorage: true
      schedule: "0 0 * * 0"
      compressionType: gzip
      storageName: aws-s3
  replsets:
  - name: rs0
    affinity:
      antiAffinityTopologyKey: none
    resources:
      limits:
        cpu: 500m
        memory: 1G
      requests:
        cpu: 100m
        memory: 0.1G
    volumeSpec:
      persistentVolumeClaim:
        resources:
          requests:
            storage: 1Gi
    size: 3
    configuration: |
      operationProfiling:
        mode: slowOp
        slowOpThresholdMs: 100
      security:
        enableEncryption: true
        redactClientLogData: false
      setParameter:
        ttlMonitorSleepSecs: 60
        wiredTigerConcurrentReadTransactions: 128
        wiredTigerConcurrentWriteTransactions: 128
      storage:
        engine: wiredTiger
        wiredTiger:
          collectionConfig:
            blockCompressor: snappy
          engineConfig:
            directoryForIndexes: false
            journalCompressor: snappy
          indexConfig:
            prefixCompression: true
  secrets:
    users: some-users
