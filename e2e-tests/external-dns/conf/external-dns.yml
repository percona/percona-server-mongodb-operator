apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: external-dns
spec:
  #platform: openshift
  image:
  unsafeFlags:
    tls: true
  tls:
    mode: disabled
  backup:
    enabled: false
  sharding:
    enabled: true
    configsvrReplSet:
      size: 3
      volumeSpec:
        persistentVolumeClaim:
          resources:
            requests:
              storage: 1Gi
      expose:
        enabled: false
    mongos:
      size: 3
      expose:
        type: ClusterIP
        externalDNS:
          prefix: mongos-p
          domain: mongo.example.com
          ttl: 120
  replsets:
  - name: rs0
    affinity:
      antiAffinityTopologyKey: none
    expose:
      enabled: true
      type: ClusterIP
      externalDNS:
        prefix: prod
        domain: mongo.example.com
        ttl: 300
    volumeSpec:
      persistentVolumeClaim:
        resources:
          requests:
            storage: 1Gi
    size: 3
  secrets:
    users: some-users
