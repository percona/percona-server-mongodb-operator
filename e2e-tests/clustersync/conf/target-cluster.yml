apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: target-cluster
spec:
  image:
  imagePullPolicy: Always
  unsafeFlags:
    replsetSize: true
    mongosSize: true
  secrets:
    users: target-users
  backup:
    enabled: true
    image: perconalab/percona-server-mongodb-operator:1.1.0-backup
    storages:
      local-s3:
        type: minio
        minio:
          credentialsSecret: s3-secret
          region: us-east-1
          bucket: operator-testing
          endpointUrl: s3-storage-all-in-one:8333
          insecureSkipTLSVerify: false
          secure: false
  sharding:
    enabled: true
    configsvrReplSet:
      size: 1
      affinity:
        antiAffinityTopologyKey: none
      resources:
        limits:
          cpu: 300m
          memory: 0.5G
        requests:
          cpu: 100m
          memory: 0.1G
      volumeSpec:
        persistentVolumeClaim:
          resources:
            requests:
              storage: 1Gi
    mongos:
      size: 1
      affinity:
        antiAffinityTopologyKey: none
      expose:
        type: ClusterIP
      resources:
        limits:
          cpu: 300m
          memory: 0.5G
        requests:
          cpu: 100m
          memory: 0.1G
  replsets:
    - name: rs0
      size: 1
      affinity:
        antiAffinityTopologyKey: none
      resources:
        limits:
          cpu: 300m
          memory: 0.5G
        requests:
          cpu: 100m
          memory: 0.1G
      volumeSpec:
        persistentVolumeClaim:
          resources:
            requests:
              storage: 1Gi
    - name: rs1
      size: 1
      affinity:
        antiAffinityTopologyKey: none
      resources:
        limits:
          cpu: 300m
          memory: 0.5G
        requests:
          cpu: 100m
          memory: 0.1G
      volumeSpec:
        persistentVolumeClaim:
          resources:
            requests:
              storage: 1Gi
