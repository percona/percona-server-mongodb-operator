apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: logcollector
spec:
  image:
  imagePullPolicy: Always
  backup:
    enabled: false
  tls:
    mode: requireTLS
    allowInvalidCertificates: true
  replsets:
    - name: rs0
      size: 3
      affinity:
        antiAffinityTopologyKey: none
      resources:
        limits:
          cpu: 500m
          memory: 1G
        requests:
          cpu: 100m
          memory: 0.1G
      volumeSpec:
        persistentVolumeClaim:
          resources:
            requests:
              storage: 1Gi
  secrets:
    users: some-users
  logcollector:
    enabled: true
    image: perconalab/fluentbit:main-logcollector
