[INPUT]
    Name             tail
    Path             ${LOG_DATA_DIR}/mongos.log
    Tag              ${POD_NAMESPACE}.${POD_NAME}.mongos.log
    Refresh_Interval 5
    DB               /tmp/flb_mongos.db
    read_from_head   true
    Path_Key         file

[OUTPUT]
    Name file
    Match ${POD_NAMESPACE}.${POD_NAME}.mongos.log
    File mongos.full.log
    Path ${LOG_DATA_DIR}/